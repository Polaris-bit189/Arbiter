# Arbiter — 打包配置（瘦包）
#
# **瘦包策略**：安装包不含 LibreOffice / Calibre / pandoc 的二进制（合计约 2.4 GiB），
# 它们由用户首次转换时按需下载（`src/main/core/downlink.ts`，多镜像 + sha256 + 续传）。
#
# ⚠️ 这份配置存在的首要理由是修掉一个**会产出 2 GiB 安装包**的问题：
# 原来的配置里 `files` 没有排除 `resources/engines/`，而那个目录下有解包好的
# LibreOffice（1.49 GiB）与 Calibre（658 MB）——直接 `npm run build:win` 会全打进去。
# 下面那条 `!resources/engines/**` 与配套的 `extraResources` 是承重的，删掉体积就会涨回 GB 级。
#
# 保留 `resources/engines/7zip-full/`（2.4 MB）：RAR 支持全靠它，而它小到不值得按需下载。
# 见 docs/NOTES.md 约束 11。

# ⚠️ 这个 appId 必须与 `src/main/index.ts` 里 `electronApp.setAppUserModelId(...)`
# 的字符串**逐字一致**。Windows 拿它当 AppUserModelID 和卸载注册表键：不一致时任务栏
# 固定失效、通知归错组，而且**不报任何错**。
# 另外它一旦发布出去就不能再改：用户机器上会留下两条卸载项，新版更新器也找不到旧版安装。
# 所以首次发布之前就要定死（现已填入项目所有者 Polaris-bit189）。
appId: io.github.polaris-bit189.arbiter

# 产品名。Windows 上它同时是 exe 名、开始菜单项与快捷方式名（见下面的 ${productName}）。
# **改这里必须同步改 package.json 的 productName**：dev 下 app.getName()（关于页显示的那个
# 名字）读的是 package.json 那一份，这一份只在打包后生效——不一致的表现是「同一份代码，
# dev 里叫一个名、装了包之后改叫另一个」。
productName: Arbiter
copyright: Copyright © 2026 Polaris

directories:
  buildResources: build

files:
  # ---- 脚手架保留的排除项 ----
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json,tsconfig.scripts.json}'
  - '!{.editorconfig,.gitattributes,.gitignore}'

  # ---- 测试残留：**绝不能进包** ----
  # ⚠️ 这两条是实测逼出来的：`.tmp-*` 在 `.gitignore` 里，而
  # **`.gitignore` 对 electron-builder 的 `files` glob 完全无效**——两套机制。
  # 于是只要有任何一次测试崩溃或被 kill 留下临时目录（`scripts/test-tasks.ts`
  # 的 `[16] 清理` 就走不到），下一次打包就会把它整个塞进 asar。
  #
  # 实测（2026-09-13）：一次被中途 kill 的 `falsify:tasks` 留下
  # `.tmp-test-tasks-52984/`（`bulk.zip` 96 MB + `blob.bin` 96 MB + `long.mp4` 39 MB
  # + 一堆 `heavy-720p*.avi`），加上 `.tmp-test-pdf/out`，
  # **瘦包从 140.9 MB 涨到 445.6 MB**——而构建全程零报错、零警告。
  # 这是「静默出错」的典型：不查体积就发不现。
  # ⚠️ **目录与文件要各来一条。** `!.tmp-*/**` 只匹配**目录里面**的东西，
  # 一个名叫 `.scratch-build.txt` 的**文件**照样进包——实测过（2026-09-14 的 0.3.2
  # 构建里进了两条 `.scratch-*.txt`，是代理自己留在仓库根的日志）。这与审计点出的
  # 「排除了文件，却漏了它的同级目录」正好是同一个错的**两个方向**。
  - '!.tmp-*/**'
  - '!**/.tmp-*/**'
  - '!.tmp-*'
  - '!**/.tmp-*'
  - '!.scratch-*/**'
  - '!**/.scratch-*/**'
  - '!.scratch-*'
  - '!**/.scratch-*'

  # ---- 仓库自带、但**只给构建用**的东西 ----
  # `vendor/` 是 `package.json` 里那个 `file:` 依赖的源 tarball（xlsx 0.20.3）。
  # ⚠️ **必须排除，否则 2.4 MB 绕一圈又回到包里**：`npm ci` 已经把 tarball 解成
  # `node_modules/xlsx`，asar 里再带一份 .tgz 纯属冗余。上面那三条
  # （`!*.7z` / `!*.zip` / `!*.tar.gz`）**挡不住它**——`.tgz` 不是 `.tar.gz`。
  # ⚠️ 两件事互不影响，别搞混：`files` 只决定**什么进 asar**，而 `npm ci` 读不读得到
  # `vendor/` 与它无关——npm 那一步发生在打包**之前**、读的是仓库工作树。
  - '!vendor'
  - '!vendor/**'

  # 仓库根偶尔会放着「打包好准备对外发的」压缩包（例如 `dist.7z`，用来发给
  # 测试者）。**它和 `.tmp-*` 是同一类隐患**：`files` 不排除它就一定会被塞进 asar。
  # 实测过一次 278 MB 的 `dist.7z` 足以把瘦包撑到 400 MB 以上。
  - '!*.7z'
  - '!*.zip'
  - '!*.tar.gz'

  # ---- 内置引擎整目录都走 extraResources（见文件下方），从 asar 里整体排除 ----
  # 承重理由有两条，第二条是 2026-09-13 审计时才发现的：
  #   1. 体积：libreoffice 1.49 GiB + calibre 628 MB + pandoc 221 MB，不能进安装包。
  #   2. **路径对不上**：引擎是独立可执行文件，要 `spawn` 它们。以前这里是逐目录排除，
  #      结果 7zip-full 留在 asar 里、靠 `asarUnpack` 解到
  #      `resources\app.asar.unpacked\resources\engines\7zip-full\`；而
  #      `src/main/core/appPaths.ts` 的 `bundledEnginePath()` 按
  #      `<resourcesPath>\engines\…` 找——**两处差了一层 `app.asar.unpacked\resources`**，
  #      于是打包后「随包内置」那一档整档落空。表现是 dev 全绿、装上包之后 RAR 支持
  #      静默消失（退到没有 RAR 编解码器的精简版 7za），而界面照样说引擎已就绪。
  - '!resources/engines/**'

  # ---- 开发期文件，运行期用不到 ----
  - '!scripts/**'
  - '!docs/**'
  - '!.github/**'
  - '!docs/NOTES.md'
  - '!CONTRIBUTING.md'
  - '!SECURITY.md'
  - '!CHANGELOG.md'
  - '!**/*.ts'
  - '!**/*.map'

  # ---- 开发者本地工具配置 / 构建缓存（2026-09-14 审计实测）----
  # 与 `.tmp-*` 那条同一类，规律也一样：**排除了文件，却漏了它的同级目录或派生文件**。
  # 审计在 62.8 MB 的 asar 里逐条点出过三个洞（合计 227 KB，是卫生问题不是体积问题）：
  #
  #   - `!docs/NOTES.md` 在列，`.claude/` 却不在 → `.claude/settings.local.json`（本地权限配置）进包
  #   - `!tsconfig.*.json` 在列，`tsconfig.node/web.tsbuildinfo` 却不在 → 156 KB 构建缓存进包
  #   - `.nezha/` 是同一类：另一个本地 AI 工具（Nezha）的仓库级配置，运行期零引用
  #
  # 这里按**目录**整条排除而不是逐个文件补：这些内容会随仓库演进（本地权限、增量编译缓存），
  # 逐文件列的话下一个文件还会漏。`**/` 那一份覆盖嵌套位置（`!glob` 不带 `**/` 只匹配根）。
  - '!.claude/**'
  - '!**/.claude/**'
  - '!.nezha/**'
  - '!**/.nezha/**'
  - '!**/*.tsbuildinfo'

  # ---- 插件源码：随**仓库**分发，不进安装包 ----
  # `plugins/arbiter/`（50 KB）与仓库根的 `.claude-plugin/`（marketplace 清单，4 KB）
  # 也在包内，而**主进程与构建里对它们的引用是 0 处**（审计实测）。
  # 依赖方向恰好相反：是**插件去找装好的应用**——`plugins/arbiter/mcp/target.mjs` 的
  # `candidateRoots()` 读的是 `resources/app.asar/out/main/mcp.js`，应用从不读插件。
  #
  # 用户的安装路径是 README 里那条 `/plugin marketplace add Polaris-bit189/Arbiter`，
  # 即**从 GitHub 拉这两份源码**。所以打进 asar 只有两个后果：白占体积，
  # 以及让下一个人以为「包里这份插件是给用户用的、动不得」。
  # ⚠️ 排除的是**包内副本**，仓库里的 `plugins/` 一个字都没动——
  # `npm run test:plugin` 与 `claude plugin validate` 读的都是仓库那份。
  - '!plugins/**'
  - '!**/.claude-plugin/**'
  - '!.claude-plugin/**'
  #
  # ⚠️ `LICENSE` 与 `THIRD_PARTY_LICENSES.md` **不能**加进这个排除列表。
  # 包内确实分发着 ffmpeg-static（GPL-3.0-or-later）与 7-Zip 完整版（LGPL-2.1-or-later），
  # 这两种许可都要求随二进制附上许可文本。省掉它们只能省几 KB，
  # 代价是分发出去的包缺合规文本——不划算。见 THIRD_PARTY_LICENSES.md。

# ⚠️ **这里曾经写的是 `asar: false`（松散目录），已于同日实测撤回。** 记下来是因为
# 它差点变成一条假约束：当时的现象是打包形态下 `out/main/{cli,mcp}.js` 报
#
#     Error: Invalid package config …\resources\app.asar\package.json
#         at Object.getNearestParentPackageJSON (node:internal/modules/package_json_reader:189)
#
# 据此判定「Node 读不进 asar，所以两个入口都起不来」——**结论是错的**。2026-09-14 用
# 同一份 electron-builder 配置重建后做受控 A/B，四种组合全部正常：
#
#   | 入口                        | `--version` / 启动 | **真做一次转换**（要加载 sharp 原生模块）      |
#   | --------------------------- | ------------------ | --------------------------------------------- |
#   | asar 里的 `out/main/cli.js` | exit 0             | **exit 0，产出合法 JPEG**（走 `unpacked` 里的 `@img`） |
#   | asar 里的 `out/main/mcp.js` | exit 0，`已就绪`   | —                                             |
#   | 启动器（插件那条路）        | `形态 = packaged`，`已就绪` | —                                    |
#
# 连 HEAD 那份插件代码（改动之前）在 asar 上也是好的，所以「改之前第 8/12 条是红的」
# 也没能复现——最可能的解释是**当时盘上那份 `resources/app.asar` 已被手工探测覆盖过**，
# 量的是自己弄脏的现场。教训与约束 30 那条同源：**判据要落在刚构建出来的产物上**。
#
# 真正与 asar 有关、且实测成立的一条是**另一件事**（保留在此以免下次再撞）：
# 自己用 `@electron/asar` 手工 repack 覆盖掉这一个 asar，`sharp` 会
# `Could not load the "sharp" module`——因为 electron-builder 的 smartUnpack 会把
# `.node` 落到 `app.asar.unpacked/` 并在索引里打标记，手工包没有。所以**别手工覆盖它**。
asarUnpack:
  - resources/**

# 命令行入口的薄壳。**必须在应用目录之外**：它要按自己的位置（`%~dp0`）去找旁边的
# `Arbiter.exe` 与 `resources\app.asar`，而 `%~dp0` 指的是应用目录本身。
#
# 它做的事是「以 ELECTRON_RUN_AS_NODE 跑入口脚本」，而不是起 Electron 本体——
# 应用有单实例锁（`src/main/index.ts`），从终端走 exe 会把 argv 转交给**正在跑的 GUI**
# 然后自己退出，命令行这边什么也拿不到。理由与用法见 README 的「命令行」一节。
extraFiles:
  - from: build/arbiter.cmd
    to: arbiter.cmd

# 内置引擎的落点：`<安装目录>\resources\engines\…`
#
# ⚠️ 这个 `to: engines` 与 `src/main/core/appPaths.ts` 的 `bundledEnginePath()` 是**成对的**：
# 打包分支写的是 `join(process.resourcesPath, 'engines', ...)`，而 `process.resourcesPath`
# 就是 `<安装目录>\resources`。改任何一边都要同时改另一边——dev 下走的是仓库根的
# `resources/engines`，两边不一致在开发时**完全看不出问题**。
#
# 瘦包：重型三件套（libreoffice / calibre / pandoc，合计 2.37 GiB）在这里也排除掉，
# 它们由用户首次转换时按需下载（`src/main/core/downlink.ts`）。7zip-full（2.4 MB）留着，
# RAR 支持全靠它，见 docs/NOTES.md 约束 11。
#
# ⚠️ 引擎是 `node scripts/fetch-*.mjs` 抓出来的，**fresh clone 里这个目录可能不存在**，
# 而 electron-builder 遇到不存在的 `from` 会直接报错。打包前先跑那两个 fetch 脚本。
extraResources:
  - from: resources/engines
    to: engines
    filter:
      - '**/*'
      - '!libreoffice/**'
      - '!calibre/**'
      - '!pandoc/**'

win:
  executableName: Arbiter
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # 一键安装会把程序塞进 %LOCALAPPDATA% 且不给选路径。这个应用的产物要落在用户自己的
  # 目录里，允许改安装位置更合理。
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # ⚠️ 未签名。安装时 SmartScreen 会警告，README 里已如实说明。
  # 买了证书之后在这里加 certificateFile / certificatePassword（走环境变量，别写进仓库）。

# 只发 Windows。macOS 需要 Apple 开发者账号 + 公证（否则 Gatekeeper 直接拦），
# Linux 上重型引擎拿不到 msiexec 那条解包路径（约束 16），都要单独设计，见 docs/PLAN.md。

# ---------- 刻意关掉更新面：`publish: null` 是承重的，别删 ----------
#
# 发布走 `.github/workflows/release.yml` 的 `softprops/action-gh-release@v2`，
# 它不需要 electron-builder 的 publish 配置。但**「不写 publish」不等于「不会产生发布源」**：
# 只要 package.json 里有 `repository` 字段，electron-builder 就会自己反推出 GitHub 发布源，
# 往 `resources/` 里落一个 `app-update.yml`（`app-builder-lib/out/publish/PublishManager.js`
# 的 `getPublishConfigsForUpdateInfo`，`publishConfigs.length === 0` 那个分支，
# 注释原文是 "default publish config is github"）。
#
# 0.3.2 的第三方静态审计把它列为观察项 **O2**：一个看起来配置好了、其实没有任何代码读的
# 更新配置——它的唯一作用，是在将来有人「顺手」装上 electron-updater 时让更新面**立刻可用**。
# 本项目 0.3.x 没有自动更新（`src/renderer/src/pages/AboutPage.tsx` 里
# 「刻意没有『检查更新』」那段是同一口径），所以这里显式写 `publish: null`。
#
# ⚠️ **显式的 `null` 与「不写这个键」在 electron-builder 里是两件事**：
# `publish === null` 会让 `getPublishConfigs()` 直接 `return null`，**不走**上面那条
# repository 反推。schema 允许 null（`{"type":["null","string"]}`），实测同理。
#
# ⚠️ **代价要说清：`latest.yml` 会跟着一起消失，两者同一个判据、拆不开。**
# `PublishManager.js` 里 `artifactCreatedWithoutExplicitPublishConfig` 第一句就是
# `if (publishConfigs == null) return;`，而 `app-update.yml` 与 `latest.yml` 都由它派生。
# `latest.yml` 是 electron-updater 的更新清单，本项目同样没有任何代码读它，
# 但 `release.yml` 的 files 清单里还列着 `dist/latest.yml`——**那一行要一起删**，
# 否则发版时 action 只会报一句 unmatched pattern（不报错，很难发现）。
# `.blockmap` **不受影响**：它由 `isBuildDifferentialAware` 决定（只看
# `nsis.differentialPackage`），与 publish 无关。
#
# 实测（2026-09-15，用 electron-builder 26.15.3 **自己的** `getConfig` 与
# `PublishManager` 导出函数做的受控 A/B，没有重建安装包）：
#
#   - 现状（不加这一行）→ `getAppUpdatePublishConfiguration()` 返回
#     `{"owner":"Polaris-bit189","repo":"Arbiter","provider":"github","updaterCacheDirName":"arbiter-updater"}`，
#     与从 `Arbiter-0.3.2-setup.exe` 内层 `$PLUGINSDIR/app-64.7z` 里抽出来的
#     `resources/app-update.yml`（90 字节）**逐字相同**。
#   - 加上 `publish: null` → 同一个函数返回 `null`，一个字节都不写。
#
# ⚠️ **`npm run build:unpack`（`--dir`）验不了这件事**：`app-update.yml` 只对 nsis 目标写
# （`PublishManager` 的 `isSuitableWindowsTarget` 只认 `nsis` / `nsis-*`），
# 所以 `--dir` 产物里本来就没有它，改坏了也看不出来。要验必须真出安装包，再查
# `dist/win-unpacked/resources/` 或从安装包内层 7z 里看（`7z l $PLUGINSDIR/app-64.7z`）。
#
# 要防的另一件事是「electron-builder 自己也去发一次、和 action 抢同一个 tag」。
# 防法不在这里，而在 `build:win` 脚本里的 `--publish never`（已实测：它**不会**抑制
# 上面那些更新文件，那是 `--publish` 与 config `publish` 两套东西）。
publish: null

npmRebuild: false
