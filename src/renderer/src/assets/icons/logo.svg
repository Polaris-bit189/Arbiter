<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 「转格式软件」徽记：调律刻度环 + 蜂窝（六边形）+ 转换双箭头 + 中心菱形 -->
  <defs>
    <linearGradient id="gGold" x1="12.95" y1="21" x2="51.05" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C6D1F"/>
      <stop offset="1" stop-color="#E8C96A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0.8 7 4 0 7.2Z" fill="#E8C96A"/>
    </marker>
  </defs>
  <!-- 刻度环（30° 十二刻度，调律刻度盘） -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#6B5622" stroke-width="1"/>
  <g stroke="#8A7130" stroke-width="1.25" stroke-linecap="round">
    <line x1="32" y1="3" x2="32" y2="7"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(30 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(60 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(90 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(120 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(150 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(180 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(210 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(240 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(270 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(300 32 32)"/>
    <line x1="32" y1="3" x2="32" y2="7" transform="rotate(330 32 32)"/>
  </g>
  <!-- 蜂窝六边形 -->
  <path d="M32 10 51.05 21 51.05 43 32 54 12.95 43 12.95 21Z" fill="none" stroke="url(#gGold)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#8A7130" stroke-width="0.75"/>
  <!-- 转换双箭头（顺时针环流） -->
  <path d="M36.27 16.06A16.5 16.5 0 0 1 47.94 27.73" fill="none" stroke="#E8C96A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M27.73 47.94A16.5 16.5 0 0 1 16.06 36.27" fill="none" stroke="#E8C96A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- 中心菱形 -->
  <rect x="32" y="32" width="7" height="7" transform="rotate(45 35.5 35.5)" fill="#E8C96A"/>
</svg>
